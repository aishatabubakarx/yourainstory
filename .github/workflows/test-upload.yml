name: Test upload (10 second private video)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - name: Check the secrets (seconds, never blocks the test)
        continue-on-error: true
        run: python tools/check_youtube.py
      - name: Send the test video
        run: python tools/test_upload.py cabin-snow-001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-upload
          path: |
            out/_test_upload/thumbnail.jpg
            out/_test_upload/upload_result.json
          if-no-files-found: ignore
