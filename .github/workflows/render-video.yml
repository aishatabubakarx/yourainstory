name: Render and upload a video

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job folder name inside jobs/ (for example cabin-snow-001)"
        required: true
        default: "cabin-snow-001"
      upload:
        description: "Upload to YouTube when finished"
        type: boolean
        default: true
      preview:
        description: "Quick test: small 720p, about 3 minutes, no upload"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (a 4 hour 4K file is about 11 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Get the saved intro and outro (built automatically the first time)
        if: ${{ !inputs.preview }}
        run: |
          mkdir -p build/brand_full
          gh release download brand-assets --dir build/brand_full --pattern "*.ts" --clobber || echo "No saved brand assets yet, they will be built now."

      - name: Render
        run: python -m engine.cli render --job "${{ inputs.job }}" ${{ inputs.preview && '--preview' || '' }}

      - name: Save newly built intro and outro for next time
        if: ${{ !inputs.preview }}
        run: |
          if [ -f build/brand_full/BUILT ]; then
            gh release view brand-assets >/dev/null 2>&1 || gh release create brand-assets --title "brand-assets" --notes "Reusable intro and outro loop."
            gh release upload brand-assets build/brand_full/intro.ts build/brand_full/outro_loop.ts --clobber
          fi

      - name: Upload to YouTube
        if: ${{ inputs.upload && !inputs.preview }}
        run: python -m engine.cli upload --job "${{ inputs.job }}"

      - name: Keep the small files (thumbnail, metadata, contact sheet)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.job }}-extras
          path: |
            out/${{ inputs.job }}*/thumbnail.jpg
            out/${{ inputs.job }}*/metadata.json
            out/${{ inputs.job }}*/timeline.json
            out/${{ inputs.job }}*/contact_sheet.jpg
            out/${{ inputs.job }}*/upload_result.json
            out/${{ inputs.job }}*/debug/**
          if-no-files-found: ignore

      - name: Keep the preview video
        if: ${{ inputs.preview }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.job }}-preview-video
          path: out/${{ inputs.job }}_preview/video.mp4
